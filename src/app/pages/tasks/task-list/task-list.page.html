<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
  </ion-toolbar>
  
  <ion-toolbar>
    <!-- Filtros de la lista de tareas-->
    <section class="filters-row">
      <!--Filtro Estado-->
      <label class="filter-col">
        <span class="filter-text">Estado</span>
        <ion-select interface="popover" [value]="statusFilter()" (ionChange)="changeStatusFilter($event)" aria-label="Estado">
          <ion-select-option value="todas">Todas</ion-select-option>
          <ion-select-option value="pendientes">Pendientes</ion-select-option>
          <ion-select-option value="completadas">Completadas</ion-select-option>
        </ion-select>
      </label>

      <!--Filtro Prioridad-->
      <label class="filter-col">
        <span class="filter-text">Prioridad</span>
        <ion-select interface="popover" [value]="priorityFilter()" (ionChange)="changePriorityFilter($event)" aria-label="Prioridad">
          <ion-select-option value="ninguno">Todas</ion-select-option>
          <ion-select-option value="alta">Alta</ion-select-option>
          <ion-select-option value="media">Media</ion-select-option>
          <ion-select-option value="baja">Baja</ion-select-option>
        </ion-select>
      </label>

      <!--filtro Fecha-->
      <label class="filter-col">
        <span class="filter-text">Fecha</span>
        <ion-select interface="popover" [value]="dateSort()" (ionChange)="changeDateSort($event)" aria-label="Fecha">
          <ion-select-option value="ninguno">Por defecto</ion-select-option>
          <ion-select-option value="desc">Mayor a menor</ion-select-option>
          <ion-select-option value="asc">Menor a mayor</ion-select-option>
        </ion-select>
      </label>

    </section>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main class="list-container">
    <section class="tasks-section">
      <ion-list lines="none">
        <!--cada una de las tasks que hayan en el array-->
        @for (task of filteredTasks(); track task.id) {
          <ion-item-sliding #slidingItem class="custom-sliding">
            <ion-item class="task-card-item" lines="none" (click)="navigateToTaskDetail(task.id)">
              <div class="task-card-content" [class.is-completed]="task.completed">
                
                <header class="task-header">
                  <h3>{{ task.title }}</h3>
                  <ion-badge [color]="getPriorityColor(task.priority)">
                    {{ task.priority }}
                  </ion-badge>
                </header>

                <footer class="task-footer">
                  <small>Límite: {{ task.deadline | date:'dd/MM/yyyy' }}</small>
                </footer>

              </div>
            </ion-item>
            <ion-item-options side="end">
              
              <ion-item-option (click)="toggleTaskCompletion(task.id, slidingItem)" [color]="task.completed ? 'medium' : 'success'">
                <ion-icon slot="icon-only" [name]="task.completed ? 'close-circle-outline' : 'checkmark-circle-outline'"></ion-icon>
              </ion-item-option>
              
              <ion-item-option color="danger" (click)="confirmDeleteTask(task.id, slidingItem)">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-item-option>

            </ion-item-options>
          </ion-item-sliding>
        <!--Si no hay ninguna sale este mensaje-->
        } @empty {
          <section class="empty-state">
            <p>No tienes tareas</p>
          </section>
        }

      </ion-list>
    </section>
  </main>

  <!--botón de crear una nueva tarea (formulario)-->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="navigateToCreateTask()" class="custom-fab">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
